<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="linktree-card">
      <img
        class="avatar"
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=240&q=80"
        alt="Profile avatar"
      />
      <h1>@linktree</h1>
      <p>Sharing links, one tap at a time.</p>

      <nav class="links" aria-label="Social and project links">
        <a href="https://github.com" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://www.linkedin.com" target="_blank" rel="noreferrer">LinkedIn</a>
        <a href="https://x.com" target="_blank" rel="noreferrer">X (Twitter)</a>
        <a href="https://www.youtube.com" target="_blank" rel="noreferrer">YouTube</a>
        <a href="https://example.com" target="_blank" rel="noreferrer">Portfolio</a>
      </nav>
    </main>
  </body>
</html>

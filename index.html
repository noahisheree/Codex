<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Secret de l'Alambic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-layout">
      <section class="hud">
        <h1>Le Secret de l'Alambic</h1>
        <p>
          Pince le tuyau et vise l'orifice d'entrée pour remplir l'alambic. Quand
          l'eau monte, la clé remonte aussi.
        </p>
        <ul>
          <li><strong>Souris :</strong> viser le jet</li>
          <li><strong>Clic maintenu :</strong> pincer le tuyau et projeter l'eau</li>
          <li><strong>R :</strong> recommencer</li>
        </ul>
        <div class="status-row">
          <p id="status">Attrape la clé !</p>
          <p id="gauge">Niveau d'eau : 0%</p>
        </div>
      </section>

      <section class="scene" aria-label="Zone de jeu">
        <canvas id="gameCanvas" width="900" height="540"></canvas>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linktree</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1222;
      --card: #1a1f38;
      --accent: #8f7bff;
      --accent-2: #5ed3ff;
      --text: #eef2ff;
      --muted: #b5bfdc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 20% 20%, #20264a 0%, var(--bg) 40%), var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .linktree {
      width: 100%;
      max-width: 440px;
      background: color-mix(in srgb, var(--card) 86%, black);
      border: 1px solid #2e3564;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.4);
    }

    .profile {
      text-align: center;
      margin-bottom: 24px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      font-weight: 700;
      color: #12162b;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      line-height: 1.2;
    }

    p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #39407a;
      background: linear-gradient(180deg, #2b3366, #252c58);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-1px);
      border-color: var(--accent-2);
      box-shadow: 0 10px 22px rgba(94, 211, 255, 0.2);
      outline: none;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: #95a0c7;
    }
  </style>
</head>
<body>
  <main class="linktree" aria-label="Linktree profile">
    <section class="profile">
      <div class="avatar" aria-hidden="true">LT</div>
      <h1>@linktree</h1>
      <p>One place for all your links.</p>
    </section>

    <ul>
      <li><a class="link" href="https://github.com" target="_blank" rel="noreferrer">GitHub</a></li>
      <li><a class="link" href="https://www.linkedin.com" target="_blank" rel="noreferrer">LinkedIn</a></li>
      <li><a class="link" href="https://x.com" target="_blank" rel="noreferrer">X / Twitter</a></li>
      <li><a class="link" href="https://www.youtube.com" target="_blank" rel="noreferrer">YouTube</a></li>
    </ul>

    <div class="footer">Made as a minimal Linktree-style page.</div>
  </main>
</body>
</html>

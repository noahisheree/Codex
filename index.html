<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree | Alex Rivera</title>
    <meta
      name="description"
      content="A personal Linktree page for Alex Rivera with links to social profiles, portfolio, and newsletter."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #1e3a8a 0%, var(--bg) 55%);
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }

      main {
        width: min(28rem, 100%);
        background: color-mix(in srgb, var(--panel) 90%, transparent);
        border: 1px solid #334155;
        border-radius: 1.25rem;
        padding: 2rem;
        backdrop-filter: blur(6px);
        box-shadow: 0 20px 45px -30px #020617;
      }

      .profile {
        text-align: center;
        margin-bottom: 1.6rem;
      }

      .avatar {
        width: 5.5rem;
        aspect-ratio: 1;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 0.8rem;
        border: 3px solid #7dd3fc;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0;
      }

      p {
        margin: 0.6rem 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      ul {
        list-style: none;
        display: grid;
        gap: 0.75rem;
        padding: 0;
        margin: 0;
      }

      a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.95rem 1rem;
        border-radius: 0.8rem;
        text-decoration: none;
        color: var(--text);
        background: #0b1226;
        border: 1px solid #334155;
        font-weight: 600;
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      a:hover,
      a:focus-visible {
        transform: translateY(-2px);
        border-color: var(--accent);
        background: #111d3d;
        outline: none;
      }

      footer {
        margin-top: 1.2rem;
        text-align: center;
        color: #94a3b8;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-label="Profile details">
        <img
          class="avatar"
          src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80"
          alt="Portrait of Alex Rivera"
        />
        <h1>Alex Rivera</h1>
        <p>Developer advocate • building useful things and sharing what I learn.</p>
      </section>

      <ul aria-label="Primary links">
        <li><a href="https://portfolio.example.com" target="_blank" rel="noreferrer">🌐 Portfolio</a></li>
        <li><a href="https://github.com/alexrivera" target="_blank" rel="noreferrer">🐙 GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/alexrivera" target="_blank" rel="noreferrer">💼 LinkedIn</a></li>
        <li><a href="https://youtube.com/@alexrivera" target="_blank" rel="noreferrer">🎥 YouTube</a></li>
        <li><a href="https://newsletter.example.com" target="_blank" rel="noreferrer">✉️ Newsletter</a></li>
      </ul>

      <footer>Built with HTML + CSS</footer>
    </main>
  </body>
</html>

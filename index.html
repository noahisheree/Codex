<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Clé de l'Alambic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <h1>La Clé de l'Alambic</h1>
        <p>
          Déplace la buse du tuyau avec la souris. Maintiens le clic (ou
          <kbd>Espace</kbd>) pour pincer le tuyau et envoyer un jet dans
          l'orifice.
        </p>
      </header>

      <section class="hud" aria-live="polite">
        <div><strong>Niveau d'eau :</strong> <span id="waterPercent">0</span>%</div>
        <div><strong>Temps :</strong> <span id="timer">0.0</span>s</div>
      </section>

      <canvas
        id="gameCanvas"
        width="920"
        height="560"
        aria-label="Jeu de précision de jet d'eau"
      ></canvas>

      <p id="status" class="status">Remplis l'alambic pour faire remonter la clé.</p>
      <button id="restartBtn" type="button">Recommencer</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>

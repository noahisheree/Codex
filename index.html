<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-label="Profile links">
        <img
          class="avatar"
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=320&q=80"
          alt="Profile avatar"
        />
        <h1 class="name">Ari Morgan</h1>
        <p class="bio">Designer • Creator • Sharing useful links</p>

        <nav class="links" aria-label="Social and project links">
          <a class="link-button" href="https://example.com/newsletter" target="_blank" rel="noreferrer">
            Newsletter
          </a>
          <a class="link-button" href="https://example.com/store" target="_blank" rel="noreferrer">
            Digital Store
          </a>
          <a class="link-button" href="https://example.com/portfolio" target="_blank" rel="noreferrer">
            Portfolio
          </a>
          <a class="link-button" href="https://example.com/youtube" target="_blank" rel="noreferrer">
            YouTube Channel
          </a>
          <a class="link-button" href="https://example.com/contact" target="_blank" rel="noreferrer">
            Contact
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Clé de l'Alambic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-layout">
      <section class="hud">
        <h1>La Clé de l'Alambic</h1>
        <p>
          Vise l'orifice d'entrée avec le tuyau et maintiens la pince
          (<strong>clic maintenu</strong> ou <strong>barre espace</strong>) pour
          propulser l'eau.
        </p>
        <div class="stats">
          <p id="pressureLabel">Pression : 0%</p>
          <p id="fillLabel">Niveau d'eau : 0%</p>
        </div>
        <button id="resetBtn" type="button">Recommencer</button>
      </section>
      <canvas id="gameCanvas" width="900" height="540" aria-label="Jeu de l'alambic"></canvas>
    </main>

    <script src="script.js"></script>
  </body>
</html>
